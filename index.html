<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vitan's personalized navigation page with quick access to frequently used websites" />
    <meta name="theme-color" content="#000000" />
    <title>Vitan's Navigation</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <main id="container" role="main">
        <!-- Logo Section -->
        <section class="logo-section" aria-label="Logo">
            <a href="https://vitan.me" class="logo-link" title="Visit Vitan's Website">
                <img class="logo-image" src="img/logo.png" alt="Vitan Navigation Logo" />
            </a>
        </section>

        <!-- Search Section -->
        <section class="search-section" aria-label="Search">
            <form class="search-form" onsubmit="search()" role="search">
                <div class="search-container">
                    <input
                        type="text"
                        id="search-input"
                        class="search-input"
                        placeholder="✎ Search Google..."
                        autocomplete="off"
                        aria-label="Search input"
                    />
                    <button type="submit" class="search-button" aria-label="Search" title="Search">🔍</button>
                </div>
            </form>
        </section>

        <!-- Edit Mode Toggle Button -->
        <div class="edit-mode-toggle">
            <button class="edit-mode-btn" id="edit-toggle-btn" title="Edit navigation links">✏️ Edit</button>
            <span class="sync-status" id="sync-status"></span>
        </div>

        <!-- Navigation Grid -->
        <section class="nav-section" aria-label="Quick Links">
            <nav class="nav-grid" id="nav-grid"></nav>
        </section>

        <!-- Edit Modal -->
        <div id="edit-modal" class="edit-modal hidden" role="dialog" aria-labelledby="modal-title">
            <div class="edit-modal-content">
                <div class="modal-header">
                    <h2 id="modal-title">📝 Edit Navigation Links</h2>
                    <button class="modal-close-btn" id="modal-close-btn" aria-label="Close edit modal">✕</button>
                </div>
                
                <div class="modal-body">
                    <!-- Links List -->
                    <div class="edit-links-list" id="edit-links-list"></div>

                    <!-- Add New Link Form -->
                    <div class="add-link-form">
                        <h3>➕ Add New Link</h3>
                        <div class="form-group">
                            <input type="text" id="new-link-title" placeholder="Link Title" maxlength="20" />
                        </div>
                        <div class="form-group">
                            <input type="url" id="new-link-url" placeholder="https://example.com" />
                        </div>
                        <div class="form-group">
                            <input type="url" id="new-link-icon" placeholder="Icon URL (optional)" />
                        </div>
                        <button class="btn-add-link" id="btn-add-link">Add Link</button>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="btn-cancel" id="btn-cancel">Cancel</button>
                    <button class="btn-save" id="btn-save">✓ Save Changes</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Firebase Script (optional, for cloud sync) -->
    <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>
    
    <!-- Application Scripts -->
    <script src="storage.js"></script>
    <script src="editor.js"></script>
    <script src="script.js"></script>
    
    <!-- Firebase Config (optional) -->
    <script src="config.js" onerror="console.log('config.js not found, cloud sync disabled')"></script>
</body>
</html>
