<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vitan's personalized navigation page with quick access to frequently used websites" />
    <meta name="theme-color" content="#000000" />
    <title>Vitan's Navigation</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <main id="container" role="main">
        <!-- Logo Section -->
        <section class="logo-section" aria-label="Logo">
            <a href="https://vitan.me" class="logo-link" title="Visit Vitan's Website">
                <img class="logo-image" src="img/logo.png" alt="Vitan Navigation Logo" />
            </a>
        </section>

        <!-- Search Section -->
        <section class="search-section" aria-label="Search">
            <form class="search-form" onsubmit="search()" role="search">
                <div class="search-container">
                    <input
                        type="text"
                        id="search-input"
                        class="search-input"
                        placeholder="✎ Search Google..."
                        autocomplete="off"
                        aria-label="Search input"
                    />
                    <button type="submit" class="search-button" aria-label="Search" title="Search">🔍</button>
                </div>
            </form>
        </section>

        <!-- Navigation Grid -->
        <section class="nav-section" aria-label="Quick Links">
            <nav class="nav-grid">
                <a href="https://vitan.me" class="nav-box" title="Visit Vitan's Website">
                    <img class="nav-icon" src="img/Vitan.png" alt="Vitan" />
                    <p class="nav-text">vitan.me</p>
                </a>

                <a href="https://github.com" class="nav-box" title="Visit GitHub">
                    <img class="nav-icon" src="img/openhub.png" alt="GitHub" />
                    <p class="nav-text">Github</p>
                </a>

                <a href="https://google.com" class="nav-box" title="Visit Google">
                    <img class="nav-icon" src="img/Google1.png" alt="Google" />
                    <p class="nav-text">Google</p>
                </a>

                <a href="https://stackoverflow.com" class="nav-box" title="Visit Stack Overflow">
                    <img class="nav-icon" src="img/stackoverflow.png" alt="Stack Overflow" />
                    <p class="nav-text">StackOverflow</p>
                </a>

                <a href="https://www.w3schools.com" class="nav-box" title="Visit W3Schools">
                    <img class="nav-icon" src="img/w3cschool.png" alt="W3Schools" />
                    <p class="nav-text">w3school</p>
                </a>

                <a href="https://www.oneplusbbs.com/?from=head" class="nav-box" title="Visit OnePlus BBS">
                    <img class="nav-icon" src="img/oneplus_bbs.png" alt="OnePlus BBS" />
                    <p class="nav-text">OnePlus</p>
                </a>

                <a href="https://www.duboku.co" class="nav-box" title="Visit Duboku">
                    <img class="nav-icon" src="img/video.png" alt="Duboku" />
                    <p class="nav-text">Duboku</p>
                </a>
            </nav>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
